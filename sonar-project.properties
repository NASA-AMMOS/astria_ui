# SonarQube Cloud configuration for astria_ui
#
# Set up per the AMMOS scanning guide:
#   https://wiki.jpl.nasa.gov/display/AmmosArch/Code+Vulnerability+Scanning+Set+Up+for+AMMOS+Open+Source+Software
#
# NOTE: confirm projectKey against the value shown under Information on the
# project's SonarQube Cloud Overview page before the first run --
# https://sonarcloud.io/organizations/nasa-ammos/projects
sonar.projectKey=NASA-AMMOS_astria_ui
sonar.organization=nasa-ammos

# Project metadata. projectVersion is overridden from package.json by the
# Security-Scan workflow.
sonar.projectName=astria_ui
sonar.projectVersion=8.7.0
sonar.projectDescription=ASTRIA UI - React frontend for browsing, searching and analyzing planetary mission imagery.

# Project links - shown in the SonarQube Cloud UI
sonar.links.scm=https://github.com/NASA-AMMOS/astria_ui
sonar.links.issue=https://github.com/NASA-AMMOS/astria_ui/issues
sonar.links.ci=https://github.com/NASA-AMMOS/astria_ui/actions

# ==========================================
# Analysis scope
# ==========================================
# Our own code only: the React app (src/), the Express proxy (server.js) and
# the pages it serves, the build tooling, and the container definitions.
#
# Deliberately not listed: public/ (static assets and a vendored minified
# pdf.js worker we only host) and docs/.
sonar.sources=src,server.js,server,.dev,docker

# Test files are intermixed with source, so they are named via
# sonar.test.exclusions below rather than sonar.tests.

# Exclusions.
#
# src/externals/ is intentionally NOT excluded: it holds vendored third-party
# React components that are bundled into our application and are absent from
# package.json, so Dependabot does not track them. If we don't scan them,
# nothing does. Their own bundled dependencies and tests are excluded.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  src/externals/**/node_modules/**,\
  src/externals/**/test/**,\
  **/*.min.js,\
  **/*.min.mjs,\
  **/*.min.css,\
  src/fonts/**,\
  src/images/**,\
  **/*.svg,\
  **/*.png,\
  **/*.ico,\
  **/*.woff,\
  **/*.woff2,\
  **/*.ttf

# Test exclusions
sonar.test.exclusions=\
  src/test/**,\
  **/*.test.js,\
  **/*.test.jsx,\
  **/*.spec.js,\
  **/*.spec.jsx

# Coverage exclusions - no coverage is currently published, but these should
# never count against it when it is.
sonar.coverage.exclusions=\
  src/test/**,\
  **/*.test.js,\
  **/*.test.jsx,\
  **/*.spec.js,\
  **/*.spec.jsx,\
  **/*.config.js,\
  .dev/**,\
  docker/**

# Duplication exclusions - vendored code is not ours to de-duplicate.
sonar.cpd.exclusions=\
  src/externals/**,\
  **/*.min.js,\
  **/*.min.mjs

# Language settings
sonar.javascript.file.suffixes=.js,.jsx,.mjs
sonar.sourceEncoding=UTF-8

sonar.tags=planetary,nasa,imagery,react,frontend,vite

# New Code: anything added in the last 30 days counts as new.
sonar.leak.period=30

# sonar.sarifReportPaths is supplied by the Security-Scan workflow, which
# passes the repaired CodeQL reports on the scanner command line.
