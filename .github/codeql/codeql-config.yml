name: "CodeQL Security Scan Configuration"

# Keep the default query suite and add the extended security queries.
disable-default-queries: false

queries:
  - uses: security-extended

# Scope note: astria_ui is a React frontend plus a small Express proxy. What is
# worth analyzing is our own application code. Everything below is either not
# ours, not code, or not shipped.
#
# src/externals/ is deliberately NOT excluded. Those are vendored third-party
# React components (react-json-inspector, react-splitter-layout) that are
# compiled into our bundle and are not declared in package.json -- so Dependabot
# does not see them and nothing else would cover them. Their own bundled
# dependencies and tests are excluded just below.
paths-ignore:
  # Dependencies and build output -- covered by Dependabot, not our source.
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/build/**'
  - '**/coverage/**'

  # Third-party code we only host or vendor wholesale.
  - 'public/**'                          # static assets + pdf.worker.min.mjs
  - 'src/externals/**/node_modules/**'   # bundled deps of a vendored component
  - 'src/externals/**/test/**'           # a vendored component's own test suite
  - '**/*.min.js'
  - '**/*.min.mjs'
  - '**/*.min.css'

  # Not code.
  - 'docs/**'
  - 'src/fonts/**'
  - 'src/images/**'
  - 'src/styles/**'

  # Tests.
  - 'src/test/**'
  - '**/*.test.js'
  - '**/*.test.jsx'
  - '**/*.spec.js'
  - '**/*.spec.jsx'

query-filters:
  # Style and maintainability suggestions add volume without adding security
  # signal; SonarQube already covers that ground.
  - exclude:
      problem.severity: recommendation
